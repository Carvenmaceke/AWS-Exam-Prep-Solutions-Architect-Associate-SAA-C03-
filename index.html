<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Roux Dental Care — Pretoria Dentist</title>
<meta name="description" content="Book a dental appointment online in Brooklyn, Pretoria. View services and pricing, contact the practice, and manage your visit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin:0;">
<style>
  :root{
    --pine:#123A66;
    --pine-light:#1E5FA3;
    --pine-dark:#081F3A;
    --ivory:#FFFFFF;
    --panel:#EAF2FB;
    --surface:#FFFFFF;
    --gold:#2E7DD1;
    --gold-dark:#1F5FA8;
    --sage:#BFD9F2;
    --text:#14213A;
    --muted:#5B7086;
    --border:#D7E3F0;
    --danger:#A5432F;
    --success:#1F7A4D;
    --radius-sm:6px;
    --radius-md:12px;
  }
  *{box-sizing:border-box;}
  .dnt{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--text);
    background:var(--ivory);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .dnt h1,.dnt h2,.dnt h3,.dnt .serif{
    font-family:'Fraunces',Georgia,'Iowan Old Style',serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .dnt a{color:inherit;text-decoration:none;}
  .dnt button{font-family:inherit;cursor:pointer;}
  .dnt input,.dnt select,.dnt textarea{font-family:inherit;font-size:15px;}

  /* ---------- layout shell ---------- */
  .dnt-wrap{max-width:1120px;margin:0 auto;padding:0 28px;}
  .dnt-hidden{display:none !important;}

  /* ---------- header ---------- */
  .dnt-header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,0.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
  .dnt-header-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;max-width:1120px;margin:0 auto;}
  .dnt-logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--pine);}
  .dnt-logo svg{flex-shrink:0;}
  .dnt-nav{display:flex;gap:28px;align-items:center;}
  .dnt-nav a{font-size:14.5px;color:var(--pine);opacity:0.82;transition:opacity .15s;}
  .dnt-nav a:hover{opacity:1;}
  .dnt-nav-call{display:flex;align-items:center;gap:8px;background:var(--pine);color:var(--ivory)!important;padding:9px 18px;border-radius:100px;font-size:14px;font-weight:500;}
  .dnt-burger{display:none;background:none;border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--pine);}
  .dnt-mobile-nav{display:none;flex-direction:column;gap:2px;padding:10px 28px 18px;border-top:1px solid var(--border);background:var(--surface);}
  .dnt-mobile-nav.open{display:flex;}
  .dnt-mobile-nav a{padding:12px 4px;font-size:15px;color:var(--pine);border-bottom:1px solid var(--panel);}
  .dnt-mobile-nav a:last-child{border-bottom:none;}
  @media(max-width:840px){
    .dnt-nav-links{display:none;}
    .dnt-nav-call{display:none;}
    .dnt-burger{display:block;}
  }

  /* ---------- hero ---------- */
  .dnt-hero{background:var(--pine);color:var(--ivory);position:relative;overflow:hidden;}
  .dnt-hero-inner{max-width:1120px;margin:0 auto;padding:76px 28px 0;display:grid;grid-template-columns:1.1fr 0.9fr;gap:40px;align-items:center;}
  @media(max-width:900px){.dnt-hero-inner{grid-template-columns:1fr;padding-top:52px;}}
  .dnt-eyebrow{font-size:14px;color:var(--sage);margin-bottom:18px;}
  .dnt-hero h1{font-size:clamp(34px,4.6vw,52px);line-height:1.08;margin:0 0 20px;max-width:15ch;}
  .dnt-hero p.lead{font-size:17.5px;color:#CFE1F5;max-width:46ch;margin:0 0 30px;}
  .dnt-hero-ctas{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:52px;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:100px;font-size:15px;font-weight:500;border:1px solid transparent;transition:transform .12s,opacity .12s;}
  .btn:active{transform:scale(0.98);}
  .btn-gold{background:var(--gold);color:#FFFFFF;}
  .btn-gold:hover{background:var(--gold-dark);}
  .btn-outline-light{border-color:rgba(255,255,255,0.45);color:var(--ivory);}
  .btn-outline-light:hover{background:rgba(255,255,255,0.08);}
  .btn-primary{background:var(--pine);color:var(--ivory);}
  .btn-primary:hover{background:var(--pine-light);}
  .btn-ghost{background:transparent;border-color:var(--border);color:var(--pine);}
  .btn-ghost:hover{background:var(--panel);}
  .btn-sm{padding:8px 14px;font-size:13.5px;border-radius:8px;}
  .btn-danger-o{border-color:var(--danger);color:var(--danger);background:transparent;}
  .btn-danger-o:hover{background:rgba(165,67,47,0.08);}
  .btn-success-o{border-color:var(--success);color:var(--success);background:transparent;}
  .btn-success-o:hover{background:rgba(62,107,82,0.08);}

  .dnt-hero-art{display:flex;justify-content:center;}
  .dnt-stat-strip{border-top:1px solid rgba(255,255,255,0.16);display:grid;grid-template-columns:repeat(3,1fr);}
  .dnt-stat{padding:24px 0;text-align:center;}
  .dnt-stat b{display:block;font-family:'Fraunces',serif;font-size:26px;color:var(--gold);}
  .dnt-stat span{font-size:13px;color:#A9C7E8;}

  /* ---------- section basics ---------- */
  .dnt-section{padding:78px 0;}
  .dnt-section.alt{background:var(--panel);}
  .dnt-head{max-width:560px;margin-bottom:44px;}
  .dnt-head h2{font-size:clamp(26px,3.2vw,34px);margin:0 0 12px;color:var(--pine-dark);}
  .dnt-head p{color:var(--muted);font-size:15.5px;margin:0;}

  /* ---------- services ---------- */
  .dnt-svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  @media(max-width:880px){.dnt-svc-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:560px){.dnt-svc-grid{grid-template-columns:1fr;}}
  .dnt-svc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:22px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s;}
  .dnt-svc-card:hover{border-color:var(--sage);}
  .dnt-svc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .dnt-svc-card h3{font-size:17.5px;margin:0;color:var(--pine-dark);}
  .dnt-svc-price{font-family:'Fraunces',serif;font-size:17px;color:var(--gold-dark);white-space:nowrap;}
  .dnt-svc-card p{font-size:14px;color:var(--muted);margin:0;flex:1;}
  .dnt-svc-card a{font-size:13.5px;font-weight:600;color:var(--pine);}
  .dnt-svc-card a:hover{text-decoration:underline;}

  /* ---------- steps ---------- */
  .dnt-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
  @media(max-width:820px){.dnt-steps{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:480px){.dnt-steps{grid-template-columns:1fr;}}
  .dnt-step{padding-top:14px;border-top:2px solid var(--gold);}
  .dnt-step b.num{font-family:'Fraunces',serif;font-size:22px;color:var(--pine);display:block;margin-bottom:8px;}
  .dnt-step h4{margin:0 0 6px;font-size:15.5px;}
  .dnt-step p{margin:0;font-size:13.8px;color:var(--muted);}

  /* ---------- booking ---------- */
  .dnt-book-grid{display:grid;grid-template-columns:1.3fr 0.9fr;gap:32px;align-items:start;}
  @media(max-width:880px){.dnt-book-grid{grid-template-columns:1fr;}}
  .dnt-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:28px;}
  .dnt-field{margin-bottom:16px;}
  .dnt-field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px;color:var(--pine-dark);}
  .dnt-field .hint{font-size:12.5px;color:var(--muted);margin-top:5px;}
  .dnt-input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--ivory);font-size:14.5px;color:var(--text);}
  .dnt-input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent;}
  .dnt-row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:520px){.dnt-row2{grid-template-columns:1fr;}}
  .dnt-file{border:1.5px dashed var(--border);border-radius:var(--radius-sm);padding:18px;text-align:center;background:var(--ivory);}
  .dnt-file.has-file{border-style:solid;border-color:var(--success);background:#F0F6F2;}
  .dnt-file input{display:none;}
  .dnt-file label{cursor:pointer;color:var(--pine);font-weight:600;font-size:14px;}
  .dnt-side-note{background:var(--panel);border-radius:var(--radius-md);padding:22px;margin-bottom:18px;}
  .dnt-side-note h4{margin:0 0 10px;font-size:15px;color:var(--pine-dark);}
  .dnt-side-note ul{margin:0;padding-left:18px;font-size:13.8px;color:var(--muted);}
  .dnt-side-note li{margin-bottom:5px;}
  .dnt-bank-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;font-size:13.5px;margin-top:10px;}
  .dnt-bank-box div{display:flex;justify-content:space-between;padding:3px 0;}
  .dnt-bank-box span:first-child{color:var(--muted);}
  .dnt-bank-box span:last-child{font-weight:600;}
  .dnt-msg{padding:12px 14px;border-radius:var(--radius-sm);font-size:13.8px;margin-bottom:14px;}
  .dnt-msg.ok{background:#EAF3EE;color:var(--success);border:1px solid #C7E0D0;}
  .dnt-msg.err{background:#FBEAE6;color:var(--danger);border:1px solid #F0CCC2;}
  .dnt-confirm{text-align:center;padding:34px 10px;}
  .dnt-confirm .ring{width:56px;height:56px;border-radius:50%;background:#EAF3EE;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}

  /* ---------- contact ---------- */
  .dnt-contact-grid{display:grid;grid-template-columns:0.85fr 1.15fr;gap:32px;}
  @media(max-width:880px){.dnt-contact-grid{grid-template-columns:1fr;}}
  .dnt-info-row{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--border);}
  .dnt-info-row:last-child{border-bottom:none;}
  .dnt-info-row .ic{width:38px;height:38px;border-radius:9px;background:var(--panel);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .dnt-info-row b{display:block;font-size:14px;margin-bottom:2px;}
  .dnt-info-row span{font-size:13.8px;color:var(--muted);}

  /* ---------- footer ---------- */
  .dnt-footer{background:var(--pine-dark);color:#AFC7E5;padding:44px 0 26px;}
  .dnt-footer-inner{display:flex;justify-content:space-between;flex-wrap:wrap;gap:24px;margin-bottom:28px;}
  .dnt-footer h5{color:var(--ivory);font-family:'Fraunces',serif;font-size:18px;margin:0 0 8px;}
  .dnt-footer-links{display:flex;gap:22px;flex-wrap:wrap;font-size:13.5px;}
  .dnt-footer-links a:hover{color:var(--ivory);}
  .dnt-footer-bottom{border-top:1px solid rgba(255,255,255,0.12);padding-top:18px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12.5px;color:#7A96BC;}
  .dnt-footer-bottom a{font-size:12.5px;color:#7A96BC;}
  .dnt-footer-bottom a:hover{color:var(--ivory);text-decoration:underline;}

  /* ---------- ADMIN ---------- */
  .dnt-admin{min-height:100vh;background:var(--panel);}
  .dnt-admin-login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--pine);padding:20px;}
  .dnt-login-card{background:var(--surface);border-radius:var(--radius-md);padding:36px;width:100%;max-width:380px;}
  .dnt-login-card h2{margin:0 0 6px;color:var(--pine-dark);font-size:22px;}
  .dnt-login-card p{margin:0 0 22px;color:var(--muted);font-size:13.8px;}
  .dnt-admin-shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh;}
  @media(max-width:760px){.dnt-admin-shell{grid-template-columns:1fr;}}
  .dnt-admin-side{background:var(--pine-dark);color:#AFC7E5;padding:24px 16px;}
  .dnt-admin-side h5{color:var(--ivory);font-family:'Fraunces',serif;font-size:18px;padding:0 10px;margin:0 0 24px;}
  .dnt-admin-tab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:#AFC7E5;padding:11px 12px;border-radius:8px;font-size:14px;margin-bottom:4px;}
  .dnt-admin-tab:hover{background:rgba(255,255,255,0.06);}
  .dnt-admin-tab.active{background:rgba(185,134,59,0.18);color:var(--gold);font-weight:600;}
  .dnt-admin-main{padding:30px 34px;}
  @media(max-width:600px){.dnt-admin-main{padding:22px 18px;}}
  .dnt-admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;}
  .dnt-admin-topbar h2{margin:0;font-size:23px;color:var(--pine-dark);}
  .dnt-pill-filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .dnt-pill{padding:7px 15px;border-radius:100px;font-size:13px;border:1px solid var(--border);background:var(--surface);color:var(--muted);}
  .dnt-pill.active{background:var(--pine);color:var(--ivory);border-color:var(--pine);}
  .dnt-booking-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px 20px;margin-bottom:12px;}
  .dnt-bk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .dnt-bk-top h4{margin:0 0 3px;font-size:15.5px;}
  .dnt-bk-meta{font-size:12.8px;color:var(--muted);}
  .dnt-badge{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:100px;white-space:nowrap;}
  .badge-pending{background:#FBF1DF;color:#8F6526;}
  .badge-accepted{background:#E7F3EC;color:var(--success);}
  .badge-declined{background:#FBEAE6;color:var(--danger);}
  .badge-completed{background:var(--panel);color:var(--pine);}
  .dnt-bk-details{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:13.5px;}
  @media(max-width:520px){.dnt-bk-details{grid-template-columns:1fr;}}
  .dnt-bk-details span{color:var(--muted);}
  .dnt-bk-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .dnt-proof-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--pine);font-weight:600;margin-top:10px;}
  .dnt-proof-link:hover{text-decoration:underline;}
  .dnt-empty{text-align:center;padding:60px 20px;color:var(--muted);}

  /* calendar */
  .dnt-cal-wrap{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;}
  @media(max-width:860px){.dnt-cal-wrap{grid-template-columns:1fr;}}
  .dnt-cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .dnt-cal-head h3{margin:0;font-size:17px;color:var(--pine-dark);}
  .dnt-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .dnt-cal-dow{font-size:11px;text-align:center;color:var(--muted);font-weight:600;padding-bottom:4px;}
  .dnt-cal-day{aspect-ratio:1;border-radius:8px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;position:relative;}
  .dnt-cal-day.empty{background:transparent;border:none;}
  .dnt-cal-day.today{border-color:var(--gold);border-width:2px;}
  .dnt-cal-day .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);position:absolute;bottom:6px;}
  .dnt-upcoming-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .dnt-upcoming-item:last-child{border-bottom:none;}
  .dnt-upcoming-item b{display:block;font-size:14px;}
  .dnt-upcoming-item .when{color:var(--muted);font-size:12.5px;}

  .dnt-settings-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:22px;margin-bottom:18px;}
  .dnt-settings-block h4{margin:0 0 14px;font-size:15.5px;color:var(--pine-dark);}
  .dnt-svc-edit-row{display:grid;grid-template-columns:1.4fr 1fr 0.8fr auto;gap:10px;margin-bottom:10px;align-items:center;}
  @media(max-width:640px){.dnt-svc-edit-row{grid-template-columns:1fr;}}
  .dnt-icon-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:8px;display:flex;align-items:center;justify-content:center;}
  .dnt-icon-btn:hover{background:var(--panel);}
</style>

<div class="dnt" id="dnt-root"></div>

<script>
(function(){
  const $root = document.getElementById('dnt-root');

  /* ---------------- default data ---------------- */
  const DEFAULT_SERVICES = [
    {id:'s1', name:'Consultation & Checkup', price:450, desc:'Full oral exam, diagnosis and treatment plan for new or returning patients.'},
    {id:'s2', name:'Scale & Polish (Cleaning)', price:650, desc:'Professional cleaning to remove plaque, tartar and surface stains.'},
    {id:'s3', name:'Tooth Filling', price:850, desc:'Composite filling for a single tooth affected by decay or minor damage.'},
    {id:'s4', name:'Tooth Extraction', price:950, desc:'Straightforward removal of a damaged, decayed or problematic tooth.'},
    {id:'s5', name:'Root Canal Treatment', price:3200, desc:'Treatment to save an infected tooth by removing damaged pulp.'},
    {id:'s6', name:'Teeth Whitening', price:2500, desc:'In-chair whitening treatment for a brighter, even smile.'},
    {id:'s7', name:'Emergency Consultation', price:750, desc:'Same-day or next-day appointment for urgent dental pain or trauma.'},
    {id:'s8', name:'Braces Consultation', price:500, desc:'Assessment and orthodontic options for children and adults.'}
  ];
  const DEFAULT_SETTINGS = {
    practiceName:'Le Roux Dental Care',
    tagline:'Family dentistry in Pretoria, built around gentle, unhurried care.',
    phone:'012 345 6789',
    whatsapp:'27823456789',
    email:'hello@lerouxdental.co.za',
    address:'14 Jacaranda Street, Brooklyn, Pretoria, 0181',
    hours:'Mon–Fri: 08:00–17:00 · Sat: 08:00–12:00 · Sun & public holidays: Closed',
    bankName:'First National Bank',
    accountHolder:'Le Roux Dental Care (Pty) Ltd',
    accountNumber:'62812345678',
    branchCode:'250655',
    accountType:'Cheque / Current',
    services: DEFAULT_SERVICES,
    adminPassword:'dental2026',
    bookingHours:{ weekdayOpen:'08:00', weekdayClose:'17:00', saturdayOpen:'08:00', saturdayClose:'12:00', closedSunday:true }
  };

  let settings = null;
  let bookings = [];
  let messages = [];
  let view = 'site';          // 'site' | 'admin-login' | 'admin'
  let mobileMenuOpen = false;
  let adminTab = 'bookings';
  let bookingFilter = 'all';
  let calMonthOffset = 0;
  let siteMsg = null;         // {type,text} contact form feedback
  let bookMsg = null;
  let bookingSubmitted = null; // last submitted booking for confirmation screen
  let proofDataUrl = null;
  let proofFileName = null;
  let selectedServiceId = '';

  /* ---------------- storage helpers ---------------- */
  const STORAGE_PREFIX = 'lerouxdental_';
  const hasArtifactStorage = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';

  async function storageGet(key, shared){
    if(hasArtifactStorage){
      try{ const r = await window.storage.get(key, shared); return r ? r.value : null; }catch(e){ return null; }
    }
    try{ return localStorage.getItem(STORAGE_PREFIX + key); }catch(e){ return null; }
  }
  async function storageSet(key, value, shared){
    if(hasArtifactStorage){
      try{ await window.storage.set(key, value, shared); return; }catch(e){ return; }
    }
    try{ localStorage.setItem(STORAGE_PREFIX + key, value); }catch(e){}
  }

  async function loadAll(){
    try{
      const v = await storageGet('settings', true);
      settings = v ? JSON.parse(v) : DEFAULT_SETTINGS;
      if(!settings.bookingHours) settings.bookingHours = DEFAULT_SETTINGS.bookingHours;
    }catch(e){ settings = DEFAULT_SETTINGS; }
    try{
      const v = await storageGet('bookings', true);
      bookings = v ? JSON.parse(v) : [];
    }catch(e){ bookings = []; }
    try{
      const v = await storageGet('messages', true);
      messages = v ? JSON.parse(v) : [];
    }catch(e){ messages = []; }
    render();
  }
  async function saveSettings(){ await storageSet('settings', JSON.stringify(settings), true); }
  async function saveBookings(){ await storageSet('bookings', JSON.stringify(bookings), true); }
  async function saveMessages(){ await storageSet('messages', JSON.stringify(messages), true); }

  function fmtMoney(n){ return 'R' + Number(n).toLocaleString('en-ZA'); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function fmtDate(d){
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('en-ZA', {weekday:'short', day:'numeric', month:'short', year:'numeric'});
  }
  function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function hoursForDate(dateStr){
    const bh = (settings && settings.bookingHours) || DEFAULT_SETTINGS.bookingHours;
    if(!dateStr) return {open:bh.weekdayOpen, close:bh.weekdayClose, closed:false};
    const day = new Date(dateStr+'T00:00:00').getDay(); // 0=Sun 6=Sat
    if(day===0) return bh.closedSunday ? {closed:true} : {open:bh.weekdayOpen, close:bh.weekdayClose, closed:false};
    if(day===6) return {open:bh.saturdayOpen, close:bh.saturdayClose, closed:false};
    return {open:bh.weekdayOpen, close:bh.weekdayClose, closed:false};
  }
  function bookedTimesForDate(dateStr){
    return bookings.filter(b => b.date===dateStr && b.status!=='declined').map(b => b.time).sort();
  }
  function fmtTime12(t){
    if(!t) return '';
    const [h,m] = t.split(':').map(Number);
    const ampm = h>=12 ? 'PM' : 'AM';
    const h12 = ((h+11)%12)+1;
    return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
  }

  function bindSite(){
    const burger = $root.querySelector('#burger-btn');
    if(burger) burger.addEventListener('click', () => { mobileMenuOpen = !mobileMenuOpen; render(); });

    $root.querySelectorAll('[data-nav]').forEach(el => {
      el.addEventListener('click', e => {
        e.preventDefault();
        const navId = el.dataset.nav;
        const wasOpen = mobileMenuOpen;
        mobileMenuOpen = false;
        if(wasOpen){
          render();
          setTimeout(() => { const t = $root.querySelector('#'+navId); if(t) t.scrollIntoView({behavior:'smooth', block:'start'}); }, 30);
        }else{
          const target = $root.querySelector('#'+navId);
          if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
        }
      });
    });
    $root.querySelectorAll('[data-select-service]').forEach(el => {
      el.addEventListener('click', e => {
        e.preventDefault();
        selectedServiceId = el.dataset.selectService;
        bookingSubmitted = null;
        render();
        setTimeout(() => { const t = $root.querySelector('#book'); if(t) t.scrollIntoView({behavior:'smooth'}); }, 30);
      });
    });

    const staffLink = $root.querySelector('#staff-login-link');
    if(staffLink) staffLink.addEventListener('click', e => { e.preventDefault(); view='admin-login'; render(); });

    const contactForm = $root.querySelector('#contact-form');
    if(contactForm) contactForm.addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(contactForm);
      const entry = {id:uid(), name:fd.get('name'), email:fd.get('email'), message:fd.get('message'), createdAt:new Date().toISOString(), read:false};
      messages.unshift(entry);
      await saveMessages();
      siteMsg = {type:'ok', text:"Message sent — we'll get back to you within a business day."};
      render();
      setTimeout(() => { const t = $root.querySelector('#contact'); if(t) t.scrollIntoView({behavior:'smooth'}); }, 30);
    });

    const dateInput = $root.querySelector('#date-input');
    const timeInput = $root.querySelector('#time-input');
    const slotHint = $root.querySelector('#slot-hint');
    function refreshSlotHint(){
      if(!dateInput || !timeInput || !slotHint) return;
      const dateStr = dateInput.value;
      if(!dateStr){ slotHint.textContent = ''; timeInput.disabled = false; timeInput.removeAttribute('min'); timeInput.removeAttribute('max'); return; }
      const h = hoursForDate(dateStr);
      if(h.closed){
        slotHint.innerHTML = "We're closed on Sundays — please choose another day.";
        slotHint.style.color = 'var(--danger)';
        timeInput.value = '';
        timeInput.disabled = true;
        return;
      }
      timeInput.disabled = false;
      timeInput.min = h.open; timeInput.max = h.close;
      const taken = bookedTimesForDate(dateStr);
      slotHint.style.color = '';
      slotHint.innerHTML = `Open ${fmtTime12(h.open)}–${fmtTime12(h.close)} that day.` + (taken.length ? ` Already booked: ${taken.map(fmtTime12).join(', ')}.` : '');
    }
    if(dateInput) dateInput.addEventListener('change', refreshSlotHint);
    refreshSlotHint();

    function setInlineMsg(text){
      const el = $root.querySelector('#inline-msg');
      if(el) el.innerHTML = text ? `<div class="dnt-msg err">${esc(text)}</div>` : '';
    }

    const fileInput = $root.querySelector('#proof-input');
    if(fileInput) fileInput.addEventListener('change', e => {
      const f = e.target.files[0];
      if(!f) return;
      const dropzone = $root.querySelector('#file-dropzone');
      const labelText = $root.querySelector('#file-label-text');
      if(f.size > 4*1024*1024){
        proofDataUrl = null; proofFileName = null;
        if(dropzone) dropzone.classList.remove('has-file');
        if(labelText) labelText.textContent = 'Click to attach image or PDF (max 4MB)';
        setInlineMsg('That file is too large. Please attach a file under 4MB.');
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        proofDataUrl = reader.result;
        proofFileName = f.name;
        if(dropzone) dropzone.classList.add('has-file');
        if(labelText) labelText.textContent = proofFileName + ' — attached';
        setInlineMsg('');
      };
      reader.readAsDataURL(f);
    });

    const bookForm = $root.querySelector('#booking-form');
    if(bookForm) bookForm.addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(bookForm);
      const dateStr = fd.get('date'), timeStr = fd.get('time');

      if(!proofDataUrl){
        setInlineMsg('Please attach your proof of payment before submitting.');
        return;
      }
      const h = hoursForDate(dateStr);
      if(h.closed){
        setInlineMsg("We're closed on Sundays — please choose another day.");
        return;
      }
      if(timeStr < h.open || timeStr > h.close){
        setInlineMsg(`Please choose a time between ${fmtTime12(h.open)} and ${fmtTime12(h.close)} for that day.`);
        return;
      }
      const conflict = bookings.some(b => b.date===dateStr && b.time===timeStr && b.status!=='declined');
      if(conflict){
        setInlineMsg('That slot is already booked — please choose a different time.');
        return;
      }

      const svc = settings.services.find(s => s.id === fd.get('service'));
      const entry = {
        id: uid(),
        name: fd.get('name'), phone: fd.get('phone'), email: fd.get('email'),
        serviceId: svc ? svc.id : '', serviceName: svc ? svc.name : 'Unspecified',
        price: svc ? svc.price : 0,
        date: dateStr, time: timeStr,
        notes: fd.get('notes') || '',
        proof: proofDataUrl, proofName: proofFileName,
        status: 'pending',
        createdAt: new Date().toISOString()
      };
      bookings.unshift(entry);
      await saveBookings();
      bookingSubmitted = entry;
      proofDataUrl = null; proofFileName = null; bookMsg = null; selectedServiceId = '';
      render();
    });

    const again = $root.querySelector('#book-another');
    if(again) again.addEventListener('click', () => { bookingSubmitted = null; render(); });
  }

  /* ================= ADMIN LOGIN ================= */

  function bindAdminLogin(){
    $root.querySelector('#admin-login-form').addEventListener('submit', e => {

  /* ================= ADMIN SHELL ================= */
  function renderAdmin(){
    const tabs = [
      {id:'bookings', label:'Bookings', icon:ic.grid},
      {id:'calendar', label:'Calendar', icon:ic.cal},
      {id:'messages', label:'Messages', icon:ic.inbox},
      {id:'settings', label:'Settings', icon:ic.cog},
    ];
    return `
      <div class="dnt-admin-shell dnt">
        <aside class="dnt-admin-side">
          <h5>${esc(settings.practiceName)}</h5>
          ${tabs.map(t => `<button class="dnt-admin-tab ${adminTab===t.id?'active':''}" data-tab="${t.id}">${t.icon} ${t.label}</button>`).join('')}
          <div style="margin-top:26px;border-top:1px solid rgba(255,255,255,0.12);padding-top:14px;">
            <button class="dnt-admin-tab" id="admin-logout">${ic.logout} Back to website</button>
          </div>
        </aside>
        <main class="dnt-admin-main">
          ${adminTab==='bookings' ? renderAdminBookings() : ''}
          ${adminTab==='calendar' ? renderAdminCalendar() : ''}

  function statusBadge(status){
    const map = {pending:'badge-pending', accepted:'badge-accepted', declined:'badge-declined', completed:'badge-completed'};
    return `<span class="dnt-badge ${map[status]||''}">${status.charAt(0).toUpperCase()+status.slice(1)}</span>`;
  }

  function renderAdminBookings(){
    const filters = ['all','pending','accepted','completed','declined'];
    const list = bookings.filter(b => bookingFilter==='all' ? true : b.status===bookingFilter)
                          .sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
    return `
      <div class="dnt-admin-topbar"><h2>Bookings</h2><span style="font-size:13px;color:var(--muted);">${bookings.length} total</span></div>
      <div class="dnt-pill-filters">
        ${filters.map(f => `<button class="dnt-pill ${bookingFilter===f?'active':''}" data-filter="${f}">${f.charAt(0).toUpperCase()+f.slice(1)} ${f!=='all' ? '('+bookings.filter(b=>b.status===f).length+')' : ''}</button>`).join('')}
      </div>
      ${list.length===0 ? `<div class="dnt-empty">No ${bookingFilter==='all'?'':bookingFilter} bookings yet.</div>` :
        list.map(b => `
        <div class="dnt-booking-card">
          <div class="dnt-bk-top">
            <div>
              <h4>${esc(b.name)} — ${esc(b.serviceName)}</h4>
              <div class="dnt-bk-meta">${fmtDate(b.date)} at ${esc(b.time)} · Submitted ${new Date(b.createdAt).toLocaleDateString('en-ZA')}</div>
            </div>
            ${statusBadge(b.status)}
          </div>
          <div class="dnt-bk-details">
            <div><span>Phone</span><br>${esc(b.phone)}</div>
            <div><span>Email</span><br>${esc(b.email)}</div>
            <div><span>Fee</span><br>${fmtMoney(b.price)}</div>
            <div><span>Notes</span><br>${b.notes ? esc(b.notes) : '—'}</div>
          </div>
          ${b.proof ? `<a class="dnt-proof-link" href="${b.proof}" download="${esc(b.proofName||'proof-of-payment')}" target="_blank" rel="noopener">${ic.file} View proof of payment (${esc(b.proofName||'file')})</a>` : ''}
          <div class="dnt-bk-actions">
            ${b.status!=='accepted' ? `<button class="btn btn-sm btn-success-o" data-action="accept" data-id="${b.id}">Accept</button>` : ''}
            ${b.status!=='declined' ? `<button class="btn btn-sm btn-danger-o" data-action="decline" data-id="${b.id}">Decline</button>` : ''}
            ${b.status==='accepted' ? `<button class="btn btn-sm btn-ghost" data-action="complete" data-id="${b.id}">Mark completed</button>` : ''}
            <button class="btn btn-sm btn-ghost" data-action="reschedule" data-id="${b.id}">Update date/time</button>
            <button class="btn btn-sm btn-ghost" data-action="delete" data-id="${b.id}">${ic.trash} Delete</button>
          </div>
        </div>
      `).join('')}
    `;
  }

  function renderAdminCalendar(){
    const now = new Date();
    const base = new Date(now.getFullYear(), now.getMonth()+calMonthOffset, 1);
    const year = base.getFullYear(), month = base.getMonth();
    const monthLabel = base.toLocaleDateString('en-ZA', {month:'long', year:'numeric'});
    const firstDow = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const todayStr = now.toISOString().slice(0,10);

    const byDate = {};
    bookings.forEach(b => { if(b.status!=='declined'){ (byDate[b.date] = byDate[b.date]||[]).push(b); } });

    let cells = '';
    for(let i=0;i<firstDow;i++) cells += `<div class="dnt-cal-day empty"></div>`;
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const has = byDate[dateStr];
      cells += `<div class="dnt-cal-day ${dateStr===todayStr?'today':''}">${d}${has ? `<span class="dot"></span>` : ''}</div>`;
    }

    const upcoming = bookings.filter(b => b.status!=='declined' && (b.date > todayStr || (b.date===todayStr)))
                              .sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time)).slice(0,8);

    return `
      <div class="dnt-admin-topbar"><h2>Calendar</h2></div>
      <div class="dnt-cal-wrap">
        <div class="dnt-card">
          <div class="dnt-cal-head">
            <button class="btn btn-sm btn-ghost" id="cal-prev">← Prev</button>
            <h3>${monthLabel}</h3>
            <button class="btn btn-sm btn-ghost" id="cal-next">Next →</button>
          </div>
          <div class="dnt-cal-grid">
            ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dnt-cal-dow">${d}</div>`).join('')}
            ${cells}
          </div>
        </div>
        <div class="dnt-card">
          <h4 style="margin:0 0 6px;font-size:15px;color:var(--pine-dark);">Upcoming appointments</h4>
          ${upcoming.length===0 ? `<div class="dnt-empty" style="padding:30px 10px;">Nothing scheduled yet.</div>` :
            upcoming.map(b => `
            <div class="dnt-upcoming-item">
              <div><b>${esc(b.name)}</b><span class="when">${esc(b.serviceName)}</span></div>
              <div style="text-align:right;"><div class="when">${fmtDate(b.date)}</div><div class="when">${esc(b.time)}</div></div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  function renderAdminMessages(){
    return `
      <div class="dnt-admin-topbar"><h2>Messages</h2><span style="font-size:13px;color:var(--muted);">${messages.length} total</span></div>
      ${messages.length===0 ? `<div class="dnt-empty">No messages yet.</div>` :
        messages.map(m => `
        <div class="dnt-booking-card">
          <div class="dnt-bk-top">
            <div><h4>${esc(m.name)}</h4><div class="dnt-bk-meta">${esc(m.email)} · ${new Date(m.createdAt).toLocaleString('en-ZA')}</div></div>
          </div>
          <p style="margin:10px 0 0;font-size:14px;">${esc(m.message)}</p>
          <div class="dnt-bk-actions">
            <button class="btn btn-sm btn-ghost" data-msg-action="delete" data-id="${m.id}">${ic.trash} Delete</button>
          </div>
        </div>
      `).join('')}
    `;
  }

  function renderAdminSettings(){
    return `
      <div class="dnt-admin-topbar"><h2>Settings</h2></div>

      <div class="dnt-settings-block">
        <h4>Practice &amp; contact details</h4>
        <form id="contact-settings-form">
          <div class="dnt-row2">
            <div class="dnt-field"><label>Practice name</label><input class="dnt-input" name="practiceName" value="${esc(settings.practiceName)}"></div>
            <div class="dnt-field"><label>Phone</label><input class="dnt-input" name="phone" value="${esc(settings.phone)}"></div>
          </div>
          <div class="dnt-field"><label>Tagline (hero headline)</label><input class="dnt-input" name="tagline" value="${esc(settings.tagline)}"></div>
          <div class="dnt-row2">
            <div class="dnt-field"><label>Email</label><input class="dnt-input" name="email" value="${esc(settings.email)}"></div>
            <div class="dnt-field"><label>Hours</label><input class="dnt-input" name="hours" value="${esc(settings.hours)}"></div>
          </div>
          <div class="dnt-field"><label>Address</label><input class="dnt-input" name="address" value="${esc(settings.address)}"></div>
          <button class="btn btn-primary btn-sm" type="submit">Save details</button>
        </form>
      </div>

      <div class="dnt-settings-block">
        <h4>Banking details (shown to patients when booking)</h4>
        <form id="bank-settings-form">
          <div class="dnt-row2">
            <div class="dnt-field"><label>Bank name</label><input class="dnt-input" name="bankName" value="${esc(settings.bankName)}"></div>
            <div class="dnt-field"><label>Account holder</label><input class="dnt-input" name="accountHolder" value="${esc(settings.accountHolder)}"></div>
          </div>
          <div class="dnt-row2">
            <div class="dnt-field"><label>Account number</label><input class="dnt-input" name="accountNumber" value="${esc(settings.accountNumber)}"></div>
            <div class="dnt-field"><label>Branch code</label><input class="dnt-input" name="branchCode" value="${esc(settings.branchCode)}"></div>
          </div>
          <div class="dnt-field"><label>Account type</label><input class="dnt-input" name="accountType" value="${esc(settings.accountType)}"></div>
          <button class="btn btn-primary btn-sm" type="submit">Save banking details</button>
        </form>
      </div>

      <div class="dnt-settings-block">
        <h4>Services &amp; default pricing</h4>
        <div id="services-editor">
          ${settings.services.map((s,i) => `
            <div class="dnt-svc-edit-row" data-svc-id="${esc(s.id)}">
              <input class="dnt-input svc-name" value="${esc(s.name)}" placeholder="Service name">
              <input class="dnt-input svc-desc" value="${esc(s.desc||'')}" placeholder="Short description">
              <input class="dnt-input svc-price" type="number" min="0" value="${s.price}" placeholder="Price (R)">
              <button type="button" class="dnt-icon-btn" data-remove-svc="${esc(s.id)}">${ic.trash}</button>
            </div>
          `).join('')}
        </div>
        <button class="btn btn-sm btn-ghost" id="add-service" style="margin-top:6px;">${ic.plus} Add service</button>
        <div style="margin-top:14px;"><button class="btn btn-primary btn-sm" id="save-services">Save services</button></div>
      </div>

      <div class="dnt-settings-block">
        <h4>Booking hours</h4>
        <p style="font-size:12.8px;color:var(--muted);margin:-8px 0 12px;">Controls which dates and times patients can request when booking online, and blocks double-bookings for the same slot.</p>
        <form id="hours-settings-form">
          <div class="dnt-row2">
            <div class="dnt-field"><label>Weekday opening time</label><input class="dnt-input" type="time" name="weekdayOpen" value="${esc(settings.bookingHours.weekdayOpen)}"></div>
            <div class="dnt-field"><label>Weekday closing time</label><input class="dnt-input" type="time" name="weekdayClose" value="${esc(settings.bookingHours.weekdayClose)}"></div>
          </div>
          <div class="dnt-row2">
            <div class="dnt-field"><label>Saturday opening time</label><input class="dnt-input" type="time" name="saturdayOpen" value="${esc(settings.bookingHours.saturdayOpen)}"></div>
            <div class="dnt-field"><label>Saturday closing time</label><input class="dnt-input" type="time" name="saturdayClose" value="${esc(settings.bookingHours.saturdayClose)}"></div>
          </div>
          <div class="dnt-field" style="display:flex;align-items:center;gap:8px;">
            <input type="checkbox" id="closed-sunday" name="closedSunday" ${settings.bookingHours.closedSunday ? 'checked' : ''} style="width:16px;height:16px;">
            <label style="margin:0;" for="closed-sunday">Closed on Sundays</label>
          </div>
          <button class="btn btn-primary btn-sm" type="submit">Save booking hours</button>
        </form>
      </div>

      <div class="dnt-settings-block">
        <h4>Admin password</h4>
        <p style="font-size:12.8px;color:var(--muted);margin:-8px 0 12px;">This is a simple, demo-level password check stored in this site's data — fine for a small practice, but not a substitute for real authentication if the site handles sensitive records long-term.</p>
        <form id="password-settings-form">
          <div class="dnt-field" style="max-width:280px;"><label>New password</label><input class="dnt-input" type="text" name="adminPassword" value="${esc(settings.adminPassword)}"></div>
          <button class="btn btn-primary btn-sm" type="submit">Update password</button>
        </form>
      </div>
    `;
  }

  function bindAdmin(){
    $root.querySelectorAll('[data-tab]').forEach(el => el.addEventListener('click', () => { adminTab = el.dataset.tab; render(); }));
    const logout = $root.querySelector('#admin-logout');
    if(logout) logout.addEventListener('click', () => { view='site'; render(); });

    // bookings
    $root.querySelectorAll('[data-filter]').forEach(el => el.addEventListener('click', () => { bookingFilter = el.dataset.filter; render(); }));
    $root.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', async () => {
      const id = el.dataset.id, action = el.dataset.action;
      const b = bookings.find(x => x.id === id);
      if(!b) return;
      if(action==='accept') b.status='accepted';
      if(action==='decline') b.status='declined';
      if(action==='complete') b.status='completed';
      if(action==='delete'){ bookings = bookings.filter(x => x.id !== id); }
      if(action==='reschedule'){
        const newDate = prompt('New date (YYYY-MM-DD):', b.date);
        const newTime = prompt('New time (HH:MM):', b.time);
        if(newDate) b.date = newDate;
        if(newTime) b.time = newTime;
      }
      await saveBookings();
      render();
    }));

    // calendar
    const prev = $root.querySelector('#cal-prev'), next = $root.querySelector('#cal-next');
    if(prev) prev.addEventListener('click', () => { calMonthOffset--; render(); });
    if(next) next.addEventListener('click', () => { calMonthOffset++; render(); });

    // messages
    $root.querySelectorAll('[data-msg-action]').forEach(el => el.addEventListener('click', async () => {
      messages = messages.filter(m => m.id !== el.dataset.id);
      await saveMessages();
      render();
    }));

    // settings: contact
    const cForm = $root.querySelector('#contact-settings-form');
    if(cForm) cForm.addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(cForm);
      ['practiceName','phone','tagline','email','hours','address'].forEach(k => settings[k] = fd.get(k));
      await saveSettings(); render();
    });
    const bForm = $root.querySelector('#bank-settings-form');
    if(bForm) bForm.addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(bForm);
      ['bankName','accountHolder','accountNumber','branchCode','accountType'].forEach(k => settings[k] = fd.get(k));
      await saveSettings(); render();
    });
    const hForm = $root.querySelector('#hours-settings-form');
    if(hForm) hForm.addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(hForm);
      settings.bookingHours = {
        weekdayOpen: fd.get('weekdayOpen') || settings.bookingHours.weekdayOpen,
        weekdayClose: fd.get('weekdayClose') || settings.bookingHours.weekdayClose,
        saturdayOpen: fd.get('saturdayOpen') || settings.bookingHours.saturdayOpen,
        saturdayClose: fd.get('saturdayClose') || settings.bookingHours.saturdayClose,
        closedSunday: fd.get('closedSunday') === 'on'
      };
      await saveSettings(); render();
    });
    const pForm = $root.querySelector('#password-settings-form');
    if(pForm) pForm.addEventListener('submit', async e => {
      e.preventDefault();
      settings.adminPassword = new FormData(pForm).get('adminPassword') || settings.adminPassword;
      await saveSettings(); render();
    });

    // services editor
    const addSvc = $root.querySelector('#add-service');
    if(addSvc) addSvc.addEventListener('click', () => {
      settings.services.push({id:uid(), name:'New service', price:0, desc:''});
      render();
    });
    $root.querySelectorAll('[data-remove-svc]').forEach(el => el.addEventListener('click', () => {
      settings.services = settings.services.filter(s => s.id !== el.dataset.removeSvc);
      render();
    }));
    const saveSvc = $root.querySelector('#save-services');
    if(saveSvc) saveSvc.addEventListener('click', async () => {
      const rows = $root.querySelectorAll('#services-editor .dnt-svc-edit-row');
      const updated = [];
      rows.forEach(row => {
        const id = row.dataset.svcId;
        const name = row.querySelector('.svc-name').value.trim();
        const desc = row.querySelector('.svc-desc').value.trim();
        const price = parseFloat(row.querySelector('.svc-price').value) || 0;
        if(name) updated.push({id, name, desc, price});
      });
      settings.services = updated;
      await saveSettings();
      render();
    });
  }

  loadAll();
})();
</script>
